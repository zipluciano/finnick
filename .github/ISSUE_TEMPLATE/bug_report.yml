name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste secret values, private keys or decrypted files.**
        Security problems go through a private report instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Error messages help.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal `.sops.yaml` and the commands that create the files, with throwaway keys.
  - type: input
    id: version
    attributes:
      label: Finnick version
      description: Output of `finnick version`
    validations:
      required: true
  - type: input
    id: sops
    attributes:
      label: sops version
      description: Output of `sops --version`
  - type: input
    id: os
    attributes:
      label: OS and browser
      placeholder: macOS 26, Safari 26
