name: Pull request

on:
  pull_request:
    types: [opened, reopened, assigned, unassigned, synchronize]

permissions:
  pull-requests: read

jobs:
  assignee:
    runs-on: ubuntu-latest
    steps:
      - name: Require an assignee
        env:
          ASSIGNEES: ${{ join(github.event.pull_request.assignees.*.login, ', ') }}
        run: |
          if [ -z "$ASSIGNEES" ]; then
            echo "::error::Assign this pull request to the person responsible for it (yourself, if you opened it). See CONTRIBUTING.md."
            exit 1
          fi
          echo "Assigned to: $ASSIGNEES"
