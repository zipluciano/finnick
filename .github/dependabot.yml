version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    assignees: [zipluciano]
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    assignees: [zipluciano]
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    assignees: [zipluciano]
    schedule:
      interval: monthly
